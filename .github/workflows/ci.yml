name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- JS runtime tests ---
  js-tests:
    name: JS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install MCP dependencies
        run: cd packages/mcp && npm install

      - name: Install browser
        run: npm run install-browser
        continue-on-error: true

      - name: Run tests
        run: npm test

  # --- Rust runtime tests ---
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies for headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run Rust tests
        working-directory: rust
        run: cargo test

      - name: Build Rust (release)
        working-directory: rust
        run: cargo build --release

  # --- Lint / format check ---
  js-lint:
    name: JS Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Check all JS files parse without syntax errors
        run: |
          find server packages scripts nsect-engine.js api.js \
            -name '*.js' -o -name '*.mjs' \
            | xargs -I{} node --check {}
